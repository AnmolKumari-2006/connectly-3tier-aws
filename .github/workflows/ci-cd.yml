# =============================================================================
#  Connectly CI/CD pipeline (GitHub Actions)
#
#  Every push to main:   test  ->  build-push  ->  deploy
#  Every pull request:   test only
#
#  test        Starts a real PostgreSQL, runs the API against it and executes
#              the 22 end to end API tests, then lints, tests (27) and builds
#              the website.
#  build-push  Builds the two Docker images and pushes them to GitHub
#              Container Registry, tagged with the short commit id and "latest".
#  deploy      Signs in to AWS with a deploy only IAM user and uses Systems
#              Manager to run the new images on the servers: the API first,
#              then the web servers one at a time, then checks the live site.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# One pipeline per branch at a time. A newer push cancels an older run only for
# pull requests; on main the older run finishes, so a deployment is never cut
# off halfway with some servers on the old version and some on the new one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test (API + website)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway PostgreSQL 16 for the API tests (the data tier).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connectly
          POSTGRES_PASSWORD: connectly_pass
          POSTGRES_DB: connectly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectly -d connectly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: connectly
      DB_PASSWORD: connectly_pass
      DB_NAME: connectly
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      STORAGE_DRIVER: local

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- API (application tier) ----
      - name: Install API dependencies
        working-directory: backend
        run: npm ci

      - name: Start the API against PostgreSQL
        working-directory: backend
        run: |
          node server.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health; then echo; echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy:"; cat api.log; exit 1

      - name: Run API tests (22 end to end tests)
        working-directory: backend
        run: npm test

      - name: Show the API log if something failed
        if: failure()
        run: cat backend/api.log || true

      # ---- Website (web tier) ----
      - name: Install website dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint the website
        working-directory: frontend
        run: npm run lint

      - name: Run website tests (27 tests)
        working-directory: frontend
        run: npm test

      - name: Build the website
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  build-push:
    name: Build and push Docker images
    needs: test
    # Only for real pushes to main, never for pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry with the built in token

    outputs:
      tag: ${{ steps.names.outputs.tag }}
      app_image: ${{ steps.names.outputs.app }}
      web_image: ${{ steps.names.outputs.web }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Work out image names and tag
        id: names
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "app=ghcr.io/${owner}/connectly-app"
            echo "web=ghcr.io/${owner}/connectly-web"
            echo "tag=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image (application tier)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Connectly API (application tier)
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push the web image (web tier)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.web }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Connectly website (web tier, Nginx)
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo "| Tier | Image |"
            echo "|---|---|"
            echo "| Web | \`${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}\` |"
            echo "| App | \`${{ steps.names.outputs.app }}:${{ steps.names.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      TAG: ${{ needs.build-push.outputs.tag }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # OIDC federation is blocked by the account's organization policy (SCP),
      # so a deploy only IAM user is used. Its keys live in encrypted GitHub
      # secrets and it can only send the deploy command to Connectly servers.
      - name: Sign in to AWS (deploy only IAM user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The API goes first, so the new website never talks to an old API.
      - name: Deploy the application tier (API)
        run: bash deploy/aws/ssm-deploy.sh app "$TAG"

      - name: Deploy the web tier (rolling, one server at a time)
        run: bash deploy/aws/ssm-deploy.sh web "$TAG"

      - name: Smoke test through the load balancer
        env:
          ALB_URL: ${{ vars.ALB_URL }}
        run: |
          for _ in $(seq 1 12); do
            if body=$(curl -sf "$ALB_URL/api/health"); then
              echo "$body"
              echo "$body" | grep -q '"database":"connected"' && echo "Live site is healthy" && exit 0
            fi
            sleep 10
          done
          echo "The site behind the load balancer is not healthy"; exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to AWS"
            echo ""
            echo "Image tag \`$TAG\` is running on the app and web tiers."
            echo ""
            echo "Live site: ${{ vars.ALB_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"